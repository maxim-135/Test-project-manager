version: '3.8'

services:
  api:
    build: .
    container_name: unified_task_manager_api
    ports:
      - "8000:8000"
      - "8002:8002"
    env_file: .env
    volumes:
      - .:/app
    restart: always

  db:
    image: postgres:15-alpine
    container_name: unified_task_manager_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: